<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Comic Sans MS','Poppins',cursive;
  background:linear-gradient(#ffe6f0,#fff);
  overflow-x:hidden;
}

/* PAGE SYSTEM */
.page{
  display:none;
  min-height:100vh;
  padding:20px;
  text-align:center;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.page.active{
  display:flex;
}

.page > * {
  margin: 10px 0;
}

button{
  position:relative;
  z-index:5;
}

h1{
  margin-top:-20px;
  color:#ff5c8a;
}

button{
  background:#ff7aa2;
  border:none;
  padding:12px 24px;
  border-radius:25px;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin:10px;
}
button:hover{background:#ff5c8a;}

.sticker{
  width:120px;
  margin:15px auto;
}

/* GALLERY */
.gallery-wrapper{
  max-height:65vh;
  overflow-y:auto;
  padding:10px;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.gallery img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(255,92,138,.3);
}

/* LETTER */
.mail-box{
  max-width:420px;
  margin:20px auto;
  background:#fff;
  border-radius:25px;
  padding:25px;
  box-shadow:0 8px 25px rgba(255,92,138,.3);
}

.mail-title{
  font-size:22px;
  color:#ff5c8a;
  margin-bottom:10px;
}

.mail-content{
  max-height:300px;
  overflow-y:auto;
  text-align:left;
  font-size:15px;
  line-height:1.7;
  white-space:pre-line;
}

/* ENVELOPE */
.envelope{
  width:260px;
  height:180px;
  margin:20px auto;
  background:#ffd1dc;
  border-radius:15px;
  position:relative;
  cursor:pointer;
  perspective:1000px;
}
.seal{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:40px;
  height:40px;
  background:#ff5c8a;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  z-index:4;
  transition:opacity .4s;
}

.envelope-body{
  width:100%;
  height:100%;
  background:#ffd1dc;
  border-radius:15px;
  position:absolute;
  bottom:0;
  z-index:1;
}

.envelope-top{
  width:100%;
  height:100%;
  background:#ffb6c9;
  position:absolute;
  top:0;
  clip-path:polygon(0 0,100% 0,50% 55%);
  transform-origin:top;
  transition:transform 0.9s ease;
  z-index:3;
}

.envelope.open .envelope-top{
  transform:rotateX(180deg);
}

.envelope.open .seal{
  opacity:0;
}

/* PINK SCROLLBAR */
.gallery-wrapper::-webkit-scrollbar,
.mail-content::-webkit-scrollbar {
  width: 8px;
}

.gallery-wrapper::-webkit-scrollbar-track,
.mail-content::-webkit-scrollbar-track {
  background: #ffe6f0;
  border-radius: 10px;
}

.gallery-wrapper::-webkit-scrollbar-thumb,
.mail-content::-webkit-scrollbar-thumb {
  background: #ff7aa2;
  border-radius: 10px;
}

.gallery-wrapper::-webkit-scrollbar-thumb:hover,
.mail-content::-webkit-scrollbar-thumb:hover {
  background: #ff5c8a;
}

.gallery-wrapper,
.mail-content {
  scrollbar-width: thin;
  scrollbar-color: #ff7aa2 #ffe6f0;
}

/* PAPER CONTAINER */
.paper-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 230, 240, 0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.paper-container.active {
  display: flex;
}

.paper {
  width: 90vw;
  max-width: 500px;
  min-height: 200px;
  max-height: 80vh;
  background: white;
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(255, 92, 138, 0.4);
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  border: 3px solid #ffd1dc;
}

.paper-content {
  font-size: 18px;
  line-height: 1.6;
  color: #333;
  margin-bottom: 20px;
  text-align: left;
  white-space: pre-line;
  width: 100%;
  min-height: 150px;
  overflow-y: auto;
}

/* CURSOR BLINK ANIMATION */
.cursor {
  display: inline-block;
  width: 2px;
  background-color: #ff5c8a;
  margin-left: 2px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.paper-hint {
  color: #ff5c8a;
  font-size: 16px;
  font-style: italic;
  margin-top: 20px;
  animation: hint-blink 1.5s infinite;
}

@keyframes hint-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.paper-step {
  color: #ff7aa2;
  font-size: 14px;
  margin-bottom: 10px;
  font-weight: bold;
}

/* HEART FLOAT */
.heart{
  position:fixed;
  bottom:-10px;
  font-size:20px;
  animation:float 4s linear forwards;
  pointer-events:none;
}

@keyframes float{
  to{
    transform:translateY(-110vh);
    opacity:0;
  }
}

.mail-box{
  transform:translateY(-40px);
  opacity:0;
  transition:.8s ease;
}

.mail-box.show{
  transform:translateY(0);
  opacity:1;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
  <h1>Welcome To Our Story💕</h1>
  <img class="sticker" src="https://media1.giphy.com/media/xOvhMKk3EyS1LKQtkK/giphy.webp">
  <p>I made this for you 🥰</p>
  <button onclick="go(2)">Next ➜</button>
</div>

<!-- PAGE 2 GALLERY -->
<div class="page" id="p2">
  <h1>Our Memories together 📸</h1>
  <img class="sticker" src="https://media4.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bjV3b3c0ZjZoOXRrNmhzZHN5NWlxcXAxOWtkejhhMHFibWM5Z3dpYSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/r49zgiCebaE0yd6UNn/giphy.webp">
  <div class="gallery-wrapper">
    <div class="gallery">
      <img src="images/family.jpg">
      <img src="images/image2.jpeg">
      <img src="images/image3.jpeg">
      <img src="images/image4.jpeg">
      <img src="images/image5.jpeg">
      <img src="images/image6.jpeg">
      <img src="images/image7.jpeg">
      <img src="images/image8.jpg">
      <img src="images/image9.jpeg">
    </div>
  </div>
  <a href="ourstory.html">
    <button>Next ➜</button>
  </a>
</div>

<!-- PAGE 5 LETTER -->
<div class="page" id="p5">
  <audio id="letterSong" loop>
    <source src="oursong.mp3" type="audio/mpeg">
  </audio>

  <h1>A Message For You 💗</h1>

  <div class="envelope" id="envelope" onclick="startUnfold()">
    <div class="envelope-body"></div>
    <div class="envelope-top"></div>
    <div class="seal">❤</div>
  </div>

  <!-- Paper Container for Step-by-Step Reading -->
  <div class="paper-container" id="paperContainer">
    <div class="paper" id="paper">
      <div class="paper-step" id="paperStep">Part 1 of 4</div>
      <div class="paper-content" id="paperContent"></div>
      <div class="paper-hint" id="paperHint">Click to continue...</div>
    </div>
  </div>

  <div class="mail-box" id="letter" style="display:none;">
    <div class="mail-title">I Love U 💖</div>
    <div class="mail-content" id="typedText"></div>
  </div>
<a href="valentine.html">
  <button>Next</button>
</a>
</div>

<script>
function go(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p'+n).classList.add('active');
}

const letterText = `Happy Valentine’s Day Jesslynnn 💖

Ga kerasa yahh udah setahun lebih kita sama-sama, masih ga nyangka bisa sedeket ini sama kau
yang awalnya kita cuma sekedar liat wajah satu sama lain dan tidak saling menyapa,
dan sekarang bisa chat tiap hari, kabarin satu sama lain, jalan-jalan bersama,
having fun together, maaf yaa kalo kadang saya nyebelin, suka kasi pertanyaan yg nda jelas

biar ko nda ngerasa nda nyaman karna saya selalu cemburu, kadang marah kalo ko begadang terlalu malam.
dan juga makasi yaa sudah ngehargain semua hal hal dan effort yang se sudah kasi ke kauuu, saya bersyukur banget ko suka ji semua yang se kasii walaupun mungkin ada barang yang ko kurang suka tapi tetap ko hargain
terutama jam sie yang se kasi itu jujur seneng bgt ko suka, awalnya se kek ragu kira kira ko bakal suka ga yaaa, atau takut nanti ko terpaksa pakai karna saya kasi ko padahal ko nda suka... tapi se bersyukur dann senang juga sama diri ku sendiri karena decided to buy it anyway
terus juga ko liat ji effort ku selama inii, jadi ngerasa berharga aja saya buat kau, dan setiap compliment yang ko kasi ke saya itu saya seneng bangett
walaupun ko ngerasa itu kek biasa aja tapi buat saya itu bedaa kalo complimentnya dari kau, dan sebenarnya dulu se ga suka banget dipuji karena yaa insekyurr, saya ga pede sama penampilan ku
selalu merasa kurang dari orang lain, jadi tiap kali orang kasi compliment rasa aneh aja dan menolak ka selalu(contohnya kek bagus rambut ku, atau cocok baju ku sama saya dll)
but you changed my perspective, se pertama kali ngerasa senang dan bangga pas ko yang kasi ka compliment dan se nda menolak complimentmu, malah itu kata kata yang se paling tunggu dari kau.
so yes, you've changed me alot to a positive way... way too positive, sampai saya juga ragu, emang dari dulu se kek gini ya? kok saya seperti orang yang berbeda pas sama kau, well lebih tepatnya pas dekat sama kau sie
bahkan ke orang lain pun se juga ngerasa berbeda mi, nda cuek cuek amat ke orang, mulai mikirin orang lain juga. jadi setelah banyak skali sifat ku ko berhasil ubah,
se mungkin mulai ngerasa i need u in my life, so i decided to protect u instead and waiting for u sampai memang sudah waktunya dan ko juga bisa memulai hubungan.
well udah kejauhan saya bicara ini, udah dehh takut kalo bicaranya kejauhan ntar endingnya ga baik. jadi kita jalanin aja sama sama , pelan pelan like we used to, and no pressure😊
semoga dengan tahun yang baru ini, dan valentine pertama yang kita rayakan bersama bisa membuat kita
jadi lebih baik untuk satu sama lain yaaaaa. Semoga kita bisa lakukan hal-hal yang menyenangkan lagi kedepannya
doing my first time with u like painting? se nda pernah pi melukis , or anything u want as long its with u. yang saya mau itu cuma spending all my time with you, semoga ko nda bosan sama saya yahh:(. 
jangan cari cowo lain selain sayaa yaaa kalo bisaaa, kalo saya belum sesuai apa yang ko mauu, then teach me how to be ur man that u wanted
i want to learn for u. Dan ini bukan ji hadiah yang spesial buat valentine, jujur gatau mau kasi hadiah apa yang bagus
jadi saya kepikiran buat website aja soalnya kalo coklat udah biasa bgt ga sie. dan maunya saya yang bikin sendiri coklatku tapi takut ga enak

alright thats it udah panjang bgt ini. babayy, lanjut di wa aja HAHAHAHA semogaa sukaa ya ini websitee, agak alay sie tapi yaudin udah lama juga urat malu ku putus kalo sama kau xixixi
ditunggu coklatnyaa kalo ada HAHAHAHA.  And last thing, hopefully we can built our relationship soon ❤️
I love you, always 💕
Once again... Happy Valentine Jesslyn💖`;

// Split letter into 4 parts
const letterParts = [
  letterText.substring(0, 300),
  letterText.substring(300, 600),
  letterText.substring(600, 900),
  letterText.substring(900)
];

let currentPaperStep = 0;
let isTyping = false;
let fullTypedText = "";
let i = 0;

function typeWriter() {
  if (i < letterText.length) {
    document.getElementById("typedText").innerHTML += letterText.charAt(i);
    i++;
    setTimeout(typeWriter, 35);
  }
}

function typeOnPaper(text, callback) {
  const paperContent = document.getElementById('paperContent');
  paperContent.innerHTML = fullTypedText; // Start with existing text
  let j = 0;
  
  function type() {
    if (j < text.length) {
      paperContent.innerHTML = fullTypedText + text.substring(0, j + 1) + '<span class="cursor"></span>';
      j++;
      setTimeout(type, 35); // Typing speed
    } else {
      fullTypedText += text; // Add the new text to the full text
      paperContent.innerHTML = fullTypedText; // Show complete text without cursor
      isTyping = false;
      if (callback) callback();
    }
  }
  
  isTyping = true;
  type();
}

function startUnfold() {
  // Open envelope
  const envelope = document.getElementById('envelope');
  envelope.classList.add('open');
  
  // Reset for new reading
  currentPaperStep = 0;
  fullTypedText = "";
  document.getElementById('paperContent').innerHTML = "";
  
  // Show paper after a short delay
  setTimeout(() => {
    document.getElementById('paperContainer').classList.add('active');
    showPaperStep();
  }, 800);
}

function showPaperStep() {
  const paperStep = document.getElementById('paperStep');
  const paperHint = document.getElementById('paperHint');
  
  paperStep.textContent = `Part ${currentPaperStep + 1} of 4`;
  
  if (currentPaperStep === 3) {
    paperHint.textContent = "1x klik lagi yaaaa kalo udah selesai bacaaaa 💗";
  } else {
    paperHint.textContent = "Klik aku donkk jangan maloe maloe...";
  }
  
  // Start typing the new part
  typeOnPaper(letterParts[currentPaperStep], () => {
    // After typing is complete, make paper clickable for next step
    const paper = document.getElementById('paper');
    paper.onclick = nextPaperStep;
  });
}

function nextPaperStep() {
  if (isTyping) return; // Don't allow click while typing
  
  currentPaperStep++;
  
  if (currentPaperStep < 4) {
    showPaperStep();
  } else {
    // Close paper and show full letter
    document.getElementById('paperContainer').classList.remove('active');
    
    // Show letter with animation
    const letter = document.getElementById('letter');
    letter.style.display = 'block';
    setTimeout(() => {
      letter.classList.add('show');
    }, 100);
  }
}
// Ambil element audio
const song = document.getElementById('letterSong');

// Fungsi untuk mulai musik dengan fade in
function playSongFadeIn(){
  song.volume = 0;   // mulai dari volume 0
  song.play().catch(()=>{});  // mainkan, ignore error
  let v = 0;
  const fade = setInterval(()=>{
    v += 0.02;  // step fade
    song.volume = Math.min(v,0.5); // max volume 0.5
    if(v >= 0.5) clearInterval(fade);
  },200);
}

// Panggil ini setelah envelope dibuka sepenuhnya
function startUnfold(){
  const envelope = document.getElementById('envelope');
  envelope.classList.add('open');
  
  currentPaperStep=0;
  fullTypedText="";
  document.getElementById('paperContent').innerHTML="";
  
  // Tampilkan paper setelah delay
  setTimeout(()=>{
    document.getElementById('paperContainer').classList.add('active');
    showPaperStep();
    // MAINKAN MUSIK DISINI setelah klik unfold
    playSongFadeIn();
  },800);
}

// URL parameter handling
const params = new URLSearchParams(window.location.search);
const page = params.get("page");
if (page) {
  go(page);
}
</script>

</body>
